openapi: 3.1.0

info:
  title: seal-gate
  version: 0.1.0
  summary: Secrets-management service with Shamir-based unsealing.
  description: >
    Lists only operations that are implemented. Each one is added in the same
    change as its handler.

servers:
  - url: /v1
    description: Version prefix. It is part of every route, not a host.

tags:
  - name: system
    description: Initialization, sealing and health. Reachable while sealed.
  - name: secrets
    description: Secret values by path. Every operation needs the instance unsealed.
  - name: policies
    description: Access policies by name. Every operation needs the instance unsealed.

paths:
  /sys/init:
    post:
      operationId: init
      tags: [system]
      summary: Initialize the instance and return its unseal shares and root token.
      description: >
        Open by design: no token can exist before initialization. The shares
        and the root token in the response are the only copy that will ever
        exist; the server keeps only a hash of the token, and none of the
        shares.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitRequest"
      responses:
        "200":
          description: Initialized. The instance stays sealed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: The request body exceeds 16384 bytes.
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /sys/unseal:
    post:
      operationId: unseal
      tags: [system]
      summary: Submit one unseal share.
      description: >
        Open by design: a sealed instance cannot check a token. Shares are
        buffered until the threshold is reached, then combined; a failed
        combination discards the buffer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsealRequest"
      responses:
        "200":
          description: Share accepted. The status shows the progress, or that the instance is unsealed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: The request body exceeds 16384 bytes.
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

  /sys/seal:
    post:
      operationId: seal
      tags: [system]
      summary: Seal the instance.
      description: >
        Open until authentication exists. Discards the key and any buffered shares.
        Idempotent: sealing a sealed or uninitialized instance also succeeds.
      security: []
      responses:
        "204":
          description: Sealed.

  /sys/status:
    get:
      operationId: status
      tags: [system]
      summary: Report whether the instance is initialized and sealed.
      description: >
        Open by design: operators read it before they can hold a token, to
        know whether to init or unseal.
      security: []
      responses:
        "200":
          description: The current state. Before init, `shares` and `threshold` are absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /sys/health:
    get:
      operationId: health
      tags: [system]
      summary: Report whether the instance can serve requests.
      description: >
        Open by design, for load balancers and probes. Only says yes or no;
        the detail is in `/sys/status`.
      security: []
      responses:
        "204":
          description: Unsealed.
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

  /secrets:
    get:
      operationId: listSecrets
      tags: [secrets]
      summary: List the paths of stored secrets, optionally under a prefix.
      description: >
        Open until authentication exists. Returns every path under the prefix,
        at any depth, never the values.
      security: []
      parameters:
        - name: prefix
          in: query
          required: false
          description: >
            Absent or empty lists every secret. Otherwise a valid secret path
            followed by `/`, so `db/` matches `db/password` but not `db` or
            `dbx/key`.
          schema:
            type: string
            maxLength: 257
          example: db/
      responses:
        "200":
          description: The matching paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

  /secrets/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: >
          The secret's path, which may contain `/` (OpenAPI cannot express a
          multi-segment parameter). Segments of `[A-Za-z0-9._-]`, none empty,
          `.` or `..`; no leading or trailing `/`; at most 256 bytes.
        schema:
          type: string
          maxLength: 256
        example: db/password

    put:
      operationId: putSecret
      tags: [secrets]
      summary: Store a secret, replacing any value already at the path.
      description: >
        Open until authentication exists. Creates or replaces; the response is
        the same either way.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretRequest"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: >
            The request body exceeds 88408 bytes, or the decoded value exceeds
            65536 bytes.
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: getSecret
      tags: [secrets]
      summary: Read a secret.
      description: Open until authentication exists.
      security: []
      responses:
        "200":
          description: The secret's value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteSecret
      tags: [secrets]
      summary: Delete a secret.
      description: >
        Open until authentication exists. Idempotent: deleting a missing secret
        also succeeds.
      security: []
      responses:
        "204":
          description: Deleted, or there was nothing to delete.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

  /policies/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: >
          The policy's name: one segment of `[A-Za-z0-9._-]`, not `.` or `..`,
          at most 128 bytes.
        schema:
          type: string
          pattern: "^(?!\\.\\.?$)[A-Za-z0-9._-]+$"
          maxLength: 128
        example: dev

    put:
      operationId: putPolicy
      tags: [policies]
      summary: Store a policy, replacing any policy already under the name.
      description: >
        Open until authentication exists. Creates or replaces; the response is
        the same either way. The name is taken from the path only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
          description: The request body exceeds 65536 bytes.
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: getPolicy
      tags: [policies]
      summary: Read a policy.
      description: Open until authentication exists.
      security: []
      responses:
        "200":
          description: The policy's rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deletePolicy
      tags: [policies]
      summary: Delete a policy.
      description: >
        Open until authentication exists. Idempotent: deleting a missing policy
        also succeeds.
      security: []
      responses:
        "204":
          description: Deleted, or there was nothing to delete.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Sealed"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  responses:
    BadRequest:
      description: The request path, body, or its values are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Nothing exists at the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Sealed:
      description: Sealed or uninitialized; either way, there is no key to serve with.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The instance is in the wrong state for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds this operation's limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: The request body is not declared as application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An internal failure. Details are logged, never sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    InitRequest:
      type: object
      description: How many shares to make, and how many unseal needs.
      required: [shares, threshold]
      properties:
        shares:
          type: integer
          minimum: 2
          maximum: 255
        threshold:
          type: integer
          minimum: 2
          maximum: 255
          description: At most `shares`.
      additionalProperties: false

    InitResponse:
      type: object
      required: [shares, root_token]
      properties:
        shares:
          type: array
          items:
            type: string
            contentEncoding: base64
        root_token:
          type: string
          contentEncoding: base64
          description: 32 bytes. Returned only here; it cannot be recovered later.
      additionalProperties: false

    UnsealRequest:
      type: object
      required: [share]
      properties:
        share:
          type: string
          contentEncoding: base64
      additionalProperties: false

    StatusResponse:
      type: object
      required: [initialized, sealed, progress]
      properties:
        initialized:
          type: boolean
        sealed:
          type: boolean
        shares:
          type: integer
          description: Absent before init.
        threshold:
          type: integer
          description: Absent before init.
        progress:
          type: integer
          minimum: 0
          description: Shares buffered toward the threshold.
      additionalProperties: false

    SecretRequest:
      type: object
      properties:
        value:
          type: string
          contentEncoding: base64
          description: At most 65536 bytes once decoded. Absent stores an empty secret.
      additionalProperties: false

    SecretResponse:
      type: object
      required: [value]
      properties:
        value:
          type: string
          contentEncoding: base64
          description: Empty for an empty secret, never null.
      additionalProperties: false

    ListResponse:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          description: Full paths, sorted by byte order. Empty when nothing matches, never null.
          items:
            type: string
      additionalProperties: false

    PolicyRequest:
      type: object
      properties:
        rules:
          type: array
          description: Absent stores a policy with no rules, which grants nothing.
          items:
            $ref: "#/components/schemas/Rule"
      additionalProperties: false

    PolicyResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          description: Empty for a policy with no rules, never null.
          items:
            $ref: "#/components/schemas/Rule"
      additionalProperties: false

    Rule:
      type: object
      description: >
        Grants its capabilities on every resource its path matches. Every matching
        rule in every policy applies, and a matching `deny` refuses whatever else
        is granted.
      required: [path, capabilities]
      properties:
        path:
          type: string
          maxLength: 257
          description: >
            A resource path, matched exactly, or a prefix ending in `*` that
            matches everything starting with it (`*` alone matches everything).
            `*` anywhere else is invalid.
          example: secrets/dev/*
        capabilities:
          type: array
          minItems: 1
          items:
            type: string
            enum: [create, read, update, delete, list, rotate, manage, deny]
      additionalProperties: false

    ErrorResponse:
      type: object
      description: >
        The body of every error response listed here. Messages are safe to show an
        operator: they never carry a secret value, share material, key material,
        or an internal error string.
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: string
      additionalProperties: false
