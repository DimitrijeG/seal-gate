name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code; the token gets nothing more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # The postgres backend's tests run against this server; without it they skip.
    # Passwordless: it lives for one job and listens only on the runner.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # An explicit bash adds pipefail, so a failing test still fails the step through tee.
      - name: Build, vet and test
        shell: bash
        env:
          SEAL_GATE_POSTGRES_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go build ./...
          go vet ./...
          go test -race -coverprofile=coverage.out ./... | tee test.out

      # A number to read, not a gate: nothing here compares it to anything.
      # Each package counts only its own tests, so one without any reads 0%.
      - name: Coverage summary
        run: |
          {
            echo '| package | coverage |'
            echo '|---|---|'
            awk -F'\t' -v module="$(go list -m)/" '/coverage: / {
              pkg = $2
              if (index(pkg, module) == 1) pkg = substr(pkg, length(module) + 1)
              pct = $0
              sub(/.*coverage: /, "", pct)
              sub(/ of statements.*/, "", pct)
              print "| `" pkg "` | " pct " |"
            }' test.out
            go tool cover -func=coverage.out | awk '/^total:/ { print "| **total** | **" $NF "** |" }'
          } >> "$GITHUB_STEP_SUMMARY"

      # Once each, so a broken benchmark fails here; `go test` never runs them.
      - name: Benchmarks
        env:
          SEAL_GATE_POSTGRES_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: go test -run '^$' -bench . -benchtime 1x ./...

      # Pinned and run via `go run`, so neither tool enters go.mod.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/graphd
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/graphd/go.mod
          # graphd has no dependency, so no go.sum to key a cache on; the step would fail.
          cache: false

      # -count=1 is redundant on a cold runner, but stops a stale pass if a
      # build cache is ever restored here.
      - name: Check import edges against the dependency rules
        run: go test -count=1 ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
