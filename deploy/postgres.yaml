# As config.yaml, but stored in postgres at SEAL_GATE_STORAGE_URL; the audit log stays on /data.
logger:
  level: info
  format: json
storage:
  type: postgres
  path: ""
crypto:
  aead_algorithm: aes-256-gcm
http:
  address: 0.0.0.0:8080
  read_header_timeout: 2s
  read_timeout: 5s
  write_timeout: 5s
  graceful_shutdown: 5s
audit:
  sinks:
    - type: file
      path: /data/seal-gate-audit.log
      required: true
      timeout: 1s
      sync: true
lifecycle:
  interval: 1m
token:
  default_ttl: 1h
  max_ttl: 24h
