name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job enables setup-go's module cache: neither the root module nor
# tools/graphd has a dependency, so there is no go.sum for it to key on and the cache
# step fails outright rather than degrading.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      # Pinned and run via `go run`, so neither tool enters go.mod.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/graphd
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/graphd/go.mod
          cache: false

      # -count=1 is redundant on a cold runner, but stops a stale pass if a
      # build cache is ever restored here.
      - name: Check import edges against the dependency rules
        run: go test -count=1 ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
